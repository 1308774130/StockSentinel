name: Stock Monitor

on:
  schedule:
    # 北京时间 9:30 - 15:00 之间，每 10 分钟运行一次
    # UTC 时间 = 北京时间 - 8
    # 1:30 UTC = 9:30 Beijing
    # 7:00 UTC = 15:00 Beijing
    # 说明：避免 7:10~7:50(北京时间 15:10~15:50) 的收盘后触发
    - cron: '30-59/10 1 * * 1-5'
    - cron: '*/10 2-6 * * 1-5'
    - cron: '0 7 * * 1-5'
  workflow_dispatch:  # 允许手动触发

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        pip install requests
        
    - name: Run Monitor
      env:
        FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        STOCK_LIST: ${{ vars.STOCK_LIST }}
      run: |
        python feishu_stock_bot.py --once
